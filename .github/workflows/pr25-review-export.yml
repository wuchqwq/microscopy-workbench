name: Temporary PR25 review bundle
on:
  push:
    branches: ['review/pr25-independent-20261030']
    paths: ['.github/workflows/pr25-review-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccf3c7863d1ebde3632875d776ebd51f77372222
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Export only committed public source and pinned compiler dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/review-bundle"
          git archive --format=tar.gz --prefix=candidate/ ccf3c7863d1ebde3632875d776ebd51f77372222 > "$RUNNER_TEMP/review-bundle/candidate.tar.gz"
          git archive --format=tar.gz --prefix=baseline/ 3790b3d57e427010f0a5cbfce8a31143a7883eef > "$RUNNER_TEMP/review-bundle/baseline.tar.gz"
          tar -czf "$RUNNER_TEMP/review-bundle/compiler-deps.tar.gz" node_modules
          git ls-tree -r ccf3c7863d1ebde3632875d776ebd51f77372222 > "$RUNNER_TEMP/review-bundle/candidate-tree.txt"
          git ls-tree -r 3790b3d57e427010f0a5cbfce8a31143a7883eef > "$RUNNER_TEMP/review-bundle/baseline-tree.txt"
          sha256sum "$RUNNER_TEMP/review-bundle/"*.tar.gz > "$RUNNER_TEMP/review-bundle/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: pr25-independent-review-ccf3c786
          path: ${{ runner.temp }}/review-bundle/
          retention-days: 3
          if-no-files-found: error
