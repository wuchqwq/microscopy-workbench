name: Standalone provider smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Classify changes / documentation check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_full_ci: ${{ steps.classify.outputs.run_full_ci }}
      run_engineering: ${{ steps.classify.outputs.run_engineering }}
      run_images: ${{ steps.classify.outputs.run_images }}
      run_spatial: ${{ steps.classify.outputs.run_spatial }}
      run_gpa: ${{ steps.classify.outputs.run_gpa }}
      run_topology: ${{ steps.classify.outputs.run_topology }}
      run_crystal: ${{ steps.classify.outputs.run_crystal }}
      run_skills: ${{ steps.classify.outputs.run_skills }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test scope and gate contracts
        run: |
          python3 -B tests/ci_scope_test.py
          python3 -B tests/ci_gate_test.py
      - name: Determine test scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git rev-parse HEAD
          bash scripts/ci_scope.sh | tee -a "$GITHUB_OUTPUT"
      - name: Check changed-file whitespace
        if: steps.classify.outputs.comparison_base != ''
        shell: bash
        env:
          COMPARISON_BASE: ${{ steps.classify.outputs.comparison_base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$COMPARISON_BASE" "$HEAD_SHA"

  client-setup:
    needs: changes
    if: needs.changes.outputs.run_engineering == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Private config preservation and isolated model-launch contracts
        run: |
          python -B tests/test_register_codex_mcp.py
          python -B tests/manual_crystal_launcher_test.py

  node-smoke:
    needs: changes
    if: needs.changes.outputs.run_engineering == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '22']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: node --check server.mjs
      - run: npm test
  dm4-reader:
    needs: changes
    if: needs.changes.outputs.run_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-images.txt
            requirements-dm4.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-images.txt -r requirements-dm4.txt
      - run: python -B tests/dm4_import_test.py
      - run: python -B tests/dm_planes_test.py
      - run: python -B tests/dm_complex_test.py
      - run: python -B tests/test_resumable_observations.py
      - run: python -B tests/image_peaks_test.py
      - run: python -B tests/test_flat_spectrum.py -v
      - run: python -B tests/test_fft_dc_roundoff.py -v
      - run: python -B tests/test_fft_preprocessing_oracle.py -v
      - run: python -B tests/test_controlled_fft_backgrounds.py -v
      - run: python -B tests/test_fft_summary_provenance.py -v
      - run: python -B tests/test_controlled_fft_fixture.py -v
      - run: python -B tests/fixtures/controlled_fft_noise.py "${{ runner.temp }}/controlled-fft-inputs" --smoke
      - run: python -B tests/fixtures/evaluate_fft_noise.py --repository . --dataset "${{ runner.temp }}/controlled-fft-inputs" --output "${{ runner.temp }}/controlled-fft-raw"
      - name: Validate noise harness execution without asserting random physical answers
        run: python -c "import json; from pathlib import Path; rows=[json.loads(line) for line in Path(r'${{ runner.temp }}/controlled-fft-raw/raw.jsonl').read_text().splitlines()]; assert len(rows)==388; assert all(r['execution']=='ok' for r in rows)"
      - run: python -B tests/fixtures/flat_spectrum_saved.py create "${{ runner.temp }}/flat-spectrum-saved"
      - run: python -B tests/fixtures/fft_dc_saved.py create "${{ runner.temp }}/fft-dc-saved"
      - run: node dist/tests/fft-dc-science-smoke.mjs
      - run: python -B tests/test_preview_admission.py
      - run: npm run test:preview-recovery
        env:
          MICROSCOPY_PYTHON: python
      - run: python -B tests/image_automation_test.py
      - run: python -B tests/image_sequence_test.py
      - run: python -B tests/image_joint_test.py
      - run: npm run test:dm4
        env:
          MICROSCOPY_PYTHON: python
      - run: npm run test:dm-planes
        env:
          MICROSCOPY_PYTHON: python
      - run: npm run test:complex
        env:
          MICROSCOPY_PYTHON: python
  spatial-evidence:
    needs: changes
    if: needs.changes.outputs.run_spatial == 'true'
    runs-on: ubuntu-latest
    # Same fixed scientific controls; allow cold provider verification on hosted
    # runners. Keep per-call trace so a hang cannot masquerade as slow science.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-images.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-images.txt
      - run: python -B tests/image_float_tiff_test.py
      - run: python -B tests/image_spatial_atlas_test.py
      - run: python -B tests/image_domain_compare_test.py
      - run: python -B tests/image_feature_field_test.py
      - run: python -B tests/image_spatial_domains_test.py
      - run: npm run test:spatial-domains
        env:
          MICROSCOPY_PYTHON: python
          MICROSCOPY_SMOKE_TRACE: '1'
      - run: node --test dist/tests/domain-measurement-binding.test.mjs
        env:
          MICROSCOPY_RUN_DOMAIN_BINDING_TEST: '1'
          MICROSCOPY_PYTHON: python

  active-analysis:
    needs: changes
    if: needs.changes.outputs.run_spatial == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-images.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-images.txt
      - run: python -B tests/image_field_increment_test.py
      - run: python -B tests/image_active_analysis_test.py
      - run: python -B tests/image_domain_neighbors_test.py
      - run: python -B tests/image_evidence_test.py
      # The full fixed-budget comparison is a reproducible acceptance command,
      # not a per-commit benchmark. Keep CI bounded to provider and contract tests.
      - run: node --test dist/tests/active-analysis-contract.test.mjs dist/tests/image-evidence-contract.test.mjs

  classical-gpa:
    needs: changes
    if: needs.changes.outputs.run_gpa == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-images.txt
            requirements-gpa.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-gpa.txt
      - run: python -B -m unittest discover -s tests -p 'test_image_gpa_*.py' -v
      - run: python -B tests/test_scientific_evidence_semantics.py
      - run: python -B tests/test_result_semantics.py
      - run: python -B tests/test_result_semantics_projection.py
      - run: python -B tests/test_route_a_runtime.py
      - run: npm run test:gpa
        env:
          MICROSCOPY_PYTHON: python

  projected-topology:
    needs: changes
    if: needs.changes.outputs.run_topology == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-images.txt
            requirements-gpa.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-gpa.txt
      - run: python -B -m unittest discover -s tests -p 'test_*topology*.py' -v
      - run: python -B tests/fixtures/topology_band_dependence.py "${{ runner.temp }}/topology-band-dependence"
      - run: python -B tests/test_method_policy.py
      - run: python -B tests/image_method_journal_test.py
      - run: python -B tests/test_method_loop_accounting.py
      - run: python -B tests/test_method_read_reuse.py
      - run: python -B tests/test_image_discovery_core.py
      - run: python -B tests/test_image_discovery_workspace.py
      - run: python -B tests/test_discovery_selection_origin.py
      - run: npm run test:topology
        env:
          MICROSCOPY_PYTHON: python

  f4-gpa-integration:
    needs: changes
    if: needs.changes.outputs.run_gpa == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-images.txt
            requirements-gpa.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-gpa.txt
      # The common science smoke runs once in ui-science-smoke.
      - run: npm run test:integration:f4-gpa
        env:
          MICROSCOPY_PYTHON: python
          MICROSCOPY_INTEGRATION_REPORT: ${{ runner.temp }}/f4-gpa/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f4-gpa-integration-report
          path: ${{ runner.temp }}/f4-gpa/report.json
          if-no-files-found: warn
          retention-days: 14

  projected-twin:
    needs: changes
    if: needs.changes.outputs.run_crystal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-images.txt
            requirements-structure-tools.txt
      # Geometry/source adapter tests need ASE, not the optional scattering stack.
      # Actual diffsims/MCP acceptance remains the reproducible test:twin command.
      - run: python -m pip install -r requirements-images.txt 'ase>=3.26,<4'
      - run: python -B tests/test_twin_geometry.py
      - run: python -B tests/test_twin_observations.py
      - run: python -B tests/test_crystal_qualification.py
      - run: python -B tests/test_general_evidence.py
      - run: python -B tests/test_general_recovery.py

  compiled-compatibility:
    needs: changes
    if: needs.changes.outputs.run_engineering == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-images.txt
      - run: npm run test:runtime:parity
      - run: npm run test:compiled:compat
        env:
          MICROSCOPY_PYTHON: python

  ui-science-smoke:
    needs: changes
    if: needs.changes.outputs.run_engineering == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-images.txt
      - name: Minimal real science and saved Panel boundary (not browser gestures)
        run: npm run test:science
        env:
          MICROSCOPY_PYTHON: python

  skill-contract:
    needs: changes
    if: needs.changes.outputs.run_skills == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Packaged Skill references and discoverable tool contracts (no model claims)
        run: node --test --test-name-pattern='packaged Skills reference' dist/tests/plugin-package.test.mjs

  ci-gate:
    name: Scoped CI gate
    if: ${{ always() }}
    needs: [changes, client-setup, node-smoke, compiled-compatibility, ui-science-smoke, dm4-reader, spatial-evidence, active-analysis, classical-gpa, f4-gpa-integration, projected-topology, projected-twin, skill-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require success for every selected check
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci_gate.py quick
