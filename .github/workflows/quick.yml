name: Standalone provider smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    name: Classify changes / documentation check
    runs-on: ubuntu-latest
    outputs:
      run_full_ci: ${{ steps.classify.outputs.run_full_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine test scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Manual runs keep the original full-test behavior.
          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            echo 'run_full_ci=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$RUNNER_TEMP/microscopy-changed-paths"
          # --no-renames ensures a code -> docs rename still checks the removed code path.
          if ! git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" > "$changed"; then
            echo '::warning::Could not inspect changed paths; running all checks.'
            echo 'run_full_ci=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_full_ci=false
          count=0
          while IFS= read -r -d '' path; do
            count=$((count + 1))
            case "$path" in
              docs/*.md) ;;
              */*) run_full_ci=true ;;
              README.md|README.*.md|CONTRIBUTING.md|CHANGELOG.md) ;;
              *) run_full_ci=true ;;
            esac
          done < "$changed"
          # Unknown or empty diffs run the complete checks. AGENTS, Skills,
          # fixtures, workflows and configuration are intentionally not exempt.
          if [[ "$count" -eq 0 ]]; then run_full_ci=true; fi
          echo "run_full_ci=$run_full_ci" >> "$GITHUB_OUTPUT"
          echo "PR files: $count; run full science CI: $run_full_ci"
      - name: Check documentation whitespace
        if: steps.classify.outputs.run_full_ci == 'false'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
  node-smoke:
    needs: changes
    if: needs.changes.outputs.run_full_ci == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '22']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: node --check server.mjs
      - run: npm test
  dm4-reader:
    needs: changes
    if: needs.changes.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-images.txt
            requirements-dm4.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-images.txt -r requirements-dm4.txt
      - run: python -B tests/dm4_import_test.py
      - run: python -B tests/dm_planes_test.py
      - run: python -B tests/dm_complex_test.py
      - run: python -B tests/image_peaks_test.py
      - run: python -B tests/image_automation_test.py
      - run: python -B tests/image_sequence_test.py
      - run: python -B tests/image_joint_test.py
      - run: npm run test:dm4
        env:
          MICROSCOPY_PYTHON: python
      - run: npm run test:dm-planes
        env:
          MICROSCOPY_PYTHON: python
      - run: npm run test:complex
        env:
          MICROSCOPY_PYTHON: python
  spatial-evidence:
    needs: changes
    if: needs.changes.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-images.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-images.txt
      - run: python -B tests/image_float_tiff_test.py
      - run: python -B tests/image_spatial_atlas_test.py
      - run: python -B tests/image_domain_compare_test.py
      - run: python -B tests/image_feature_field_test.py
      - run: node --test dist/tests/domain-measurement-binding.test.mjs
        env:
          MICROSCOPY_RUN_DOMAIN_BINDING_TEST: '1'
          MICROSCOPY_PYTHON: python

  classical-gpa:
    needs: changes
    if: needs.changes.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-images.txt
            requirements-gpa.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-gpa.txt
      - run: python -B -m unittest discover -s tests -p 'test_image_gpa_*.py' -v
      - run: npm run test:gpa
        env:
          MICROSCOPY_PYTHON: python

  compiled-compatibility:
    needs: changes
    if: needs.changes.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: python -m pip install -r requirements-images.txt
      - run: npm run test:runtime:parity
      - run: npm run test:compiled:compat
        env:
          MICROSCOPY_PYTHON: python
