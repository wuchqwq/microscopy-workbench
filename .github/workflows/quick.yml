name: Standalone provider smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '22']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: node --check server.mjs
      - run: npm test
  dm4-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-images.txt
            requirements-dm4.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-images.txt -r requirements-dm4.txt
      - run: python -B tests/dm4_import_test.py
      - run: python -B tests/dm_planes_test.py
      - run: python -B tests/dm_complex_test.py
      - run: python -B tests/image_peaks_test.py
      - run: python -B tests/image_automation_test.py
      - run: python -B tests/image_sequence_test.py
      - run: python -B tests/image_joint_test.py
      - run: npm run test:dm4
        env:
          MICROSCOPY_PYTHON: python
      - run: npm run test:dm-planes
        env:
          MICROSCOPY_PYTHON: python
      - run: npm run test:complex
        env:
          MICROSCOPY_PYTHON: python
  spatial-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-images.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-images.txt
      - run: python -B tests/image_float_tiff_test.py
      - run: python -B tests/image_spatial_atlas_test.py
      - run: python -B tests/image_domain_compare_test.py
      - run: python -B tests/image_feature_field_test.py
      - run: python -B tests/image_spatial_domains_test.py
      - run: npm run test:spatial-domains
        env:
          MICROSCOPY_PYTHON: python
      - run: node --test dist/tests/domain-measurement-binding.test.mjs
        env:
          MICROSCOPY_RUN_DOMAIN_BINDING_TEST: '1'
          MICROSCOPY_PYTHON: python

  active-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-images.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-images.txt
      - run: python -B tests/image_field_increment_test.py
      - run: python -B tests/image_active_analysis_test.py
      # The full fixed-budget comparison is a reproducible acceptance command,
      # not a per-commit benchmark. Keep CI bounded to provider and contract tests.
      - run: node --test dist/tests/active-analysis-contract.test.mjs

  compiled-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: python -m pip install -r requirements-images.txt
      - run: npm run test:runtime:parity
      - run: npm run test:compiled:compat
        env:
          MICROSCOPY_PYTHON: python
