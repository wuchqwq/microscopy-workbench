name: Review F3b finite direction correction
on:
  push:
    branches: ['review/f3b-direction-fix-20261030']
permissions:
  contents: write
jobs:
  qualify-isolated-candidate:
    if: github.ref == 'refs/heads/review/f3b-direction-fix-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r requirements-images.txt -r requirements-structure-tools.txt
      - name: Generate actual pre-fix historical MCP records
        env:
          MICROSCOPY_PYTHON: python
          MICROSCOPY_SMOKE_OUTPUT: ${{ runner.temp }}/f3b-baseline
        run: npm run test:twin
      - name: Apply exact-anchor fix and verify historical readback
        env:
          F3B_BASELINE_WORKSPACE: ${{ runner.temp }}/f3b-baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/review_f3b_direction_patch.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "if metadata.get('kind') != 'twin_compare':": "if metadata.get('kind') != 'twin_compare' or path.parent.parent.name != 'objects':",
              "assert read['projected_relation'] == metadata['projected_relation']": "assert read['result']['projected_relation'] == metadata['projected_relation']",
              "separated = angle > threshold + _ROUND_OFF": "separated = bool(angle > threshold + _ROUND_OFF)",
          }
          for before, after in replacements.items():
              assert s.count(before) == 1, before
              s = s.replace(before, after)
          p.write_text(s, encoding='utf-8')
          test = Path('tests/test_twin_direction_resolution.py')
          t = test.read_text(encoding='utf-8').replace('import copy\n', 'import copy\nimport json\n', 1)
          marker = "\n\nif __name__ == '__main__':"
          assert t.count(marker) == 1
          extra = '''
              def test_reports_are_strict_json_for_unresolved_and_positive_inputs(self):
                  for q in ([[.4, .2], [-.400001, -.199999]], [[.4, .2], [.2, -.4]]):
                      result = twin._independence(rows(q))
                      decoded = json.loads(json.dumps(result, allow_nan=False))
                      self.assertEqual(decoded, result)
                  result = twin.evaluate(*cases(), REGISTRATION, .005, interface=INTERFACE)
                  self.assertEqual(json.loads(json.dumps(result, allow_nan=False)), result)
          '''
          import textwrap
          t = t.replace(marker, '\n' + textwrap.indent(textwrap.dedent(extra).strip(), '    ') + marker)
          test.write_text(t, encoding='utf-8')
          PY
          python -B scripts/review_f3b_direction_patch.py
          git restore -- scripts/review_f3b_direction_patch.py
      - name: Focused direction and existing source geometry tests
        run: python -B -m unittest discover -s tests -p 'test_twin*.py' -v
      - run: npm run typecheck
      - run: npm test
      - name: Actual post-fix compiled MCP and pinned diffsims
        env:
          MICROSCOPY_PYTHON: python
          MICROSCOPY_SMOKE_OUTPUT: ${{ runner.temp }}/f3b-after-fix
        run: npm run test:twin
      - name: Existing standalone scientific smoke
        env:
          MICROSCOPY_PYTHON: python
        run: npm run test:science
      - name: Publish only the qualified isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'review/f3b-direction-fix-20261030'
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --exit-code -- .github/workflows scripts
          git add crystallography/twin_geometry.py docs/PROJECTED_TWIN_EVIDENCE.md README.zh-CN.md docs/validation/f3b/direction-review.json tests/test_twin_direction_resolution.py
          git diff --cached --check
          git commit -m 'fix: reject unresolved Friedel and harmonic direction jitter with versioned evidence'
          git archive --format=tar HEAD > "$RUNNER_TEMP/f3b-reviewed-source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/f3b-reviewed-commit.txt"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3b-direction-before-after
          path: |
            ${{ runner.temp }}/f3b-baseline/report.json
            ${{ runner.temp }}/f3b-after-fix/report.json
            ${{ runner.temp }}/f3b-reviewed-source.tar
            ${{ runner.temp }}/f3b-reviewed-commit.txt
            docs/validation/f3b/direction-review.json
          if-no-files-found: warn
          retention-days: 14
