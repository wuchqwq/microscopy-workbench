# Temporary, branch-scoped assembly runner. Remove after publishing the candidate.
# It never writes main or either source PR branch and cannot change workflows.
name: Assemble pinned F4 and GPA integration
on:
  push:
    branches: [review/f4-gpa-integration-20261030]
permissions:
  contents: read
jobs:
  assemble:
    if: startsWith(github.event.head_commit.message, 'integration-bootstrap:')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build the explicit isolated integration commit
        shell: bash
        env:
          MICROSCOPY_INTEGRATION_ASSEMBLE: '1'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.autocrlf false
          python3 scripts/assemble_f4_gpa.py | tee "$RUNNER_TEMP/assembly.json"
          test -z "$(git diff --name-only "$GITHUB_SHA" HEAD -- .github/workflows)"
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile and run portable contracts
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test 2>&1 | tee "$RUNNER_TEMP/integration-node.log"
      - name: Run independent scientific handoff and old compatibility
        env:
          MICROSCOPY_PYTHON: python
          MICROSCOPY_INTEGRATION_REPORT: ${{ runner.temp }}/integration-report.json
        run: |
          set -euo pipefail
          python -m pip install -r requirements-gpa.txt
          python -B -m unittest discover -s tests -p 'test_image_gpa_*.py' -v 2>&1 | tee "$RUNNER_TEMP/integration-gpa.log"
          npm run test:integration:f4-gpa 2>&1 | tee "$RUNNER_TEMP/integration-handoff.log"
          npm run test:science 2>&1 | tee "$RUNNER_TEMP/integration-science.log"
          npm run test:compiled:compat 2>&1 | tee "$RUNNER_TEMP/integration-compat.log"
      - name: Retain reproducible candidate and logs
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/integration-evidence"
          for f in assembly.json integration-node.log integration-gpa.log integration-handoff.log integration-science.log integration-compat.log integration-report.json; do
            if test -f "$RUNNER_TEMP/$f"; then cp "$RUNNER_TEMP/$f" "$RUNNER_TEMP/integration-evidence/"; fi
          done
          git diff --binary 3678c54a0b8c57ec027fcfd03fd856489d26184c HEAD > "$RUNNER_TEMP/integration-evidence/candidate.patch"
          git bundle create "$RUNNER_TEMP/integration-evidence/candidate.bundle" HEAD --branches --tags
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f4-gpa-assembly-evidence
          path: ${{ runner.temp }}/integration-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Publish only the verified isolated branch (no merge)
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=refs/heads/review/f4-gpa-integration-20261030
          test "$GITHUB_REF" = "$branch"
          test -z "$(git status --porcelain)"
          test -z "$(git diff --name-only "$GITHUB_SHA" HEAD -- .github/workflows)"
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          auth=$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)
          actual=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "$branch" | cut -f1)
          test "$actual" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$branch"
